services:
  - type: web
    name: learn-ai-engineering-backend
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learn-ai-engineering-db
          property: connectionString
      - key: ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: SEED_MAINTAINER_EMAIL
        sync: false
      - key: SEED_MAINTAINER_PASSWORD
        sync: false

databases:
  - name: learn-ai-engineering-db
    databaseName: learn_ai_engineering
    user: learn
    plan: free
    ipAllowList: []
