openapi: 3.1.0

info:
  title: AI Engineering Learning Platform API
  version: "1.0.0"
  description: |
    The public interface of version 1 for the content and quiz endpoints: the topics, the
    lessons of a topic, the quiz of a topic, authentication and session, and the health
    check the containers use.

    Topics are addressed by their slug, lessons by their id. Only published content is
    returned: a draft topic, lesson or question never appears in a response.

    The session is kept in a cookie that is `HttpOnly` and `SameSite`, `Secure` in
    production, path `/`, with a fixed expiry of 7 days. Cross-site request forgery
    protection is required: the token is issued at registration, log in and on every read
    of the current session, and must be sent back in a header on every state-changing
    request that carries a session cookie. `GET` does not require it. A quiz submission
    that carries a session cookie is state-changing and needs the token; an anonymous
    submission without a session cookie is accepted without it. A submission with a
    missing, invalid or expired session cookie is treated as anonymous and is not rejected
    with a 401.

    The lesson progress, the quiz history and the maintainer operations are added to this
    contract later; they are not described here.

servers:
  - url: http://localhost:8080
    description: The API server of the local development stack.

tags:
  - name: content
    description: The published topics, lessons, and questions of a topic.
  - name: quiz
    description: The quiz of a topic, starting it and submitting the answers.
  - name: auth
    description: Registration, authentication, session and logout.
  - name: progress
    description: Lesson progress for the logged-in user.
  - name: history
    description: Quiz attempts for the logged-in user.
  - name: health
    description: The health check of the service.

security: []

paths:
  /topics:
    get:
      tags:
        - content
      summary: List the published topics
      operationId: listTopics
      description: |
        Returns every published topic, ordered by `position`. Only published content is
        returned: a draft topic is never part of the response.

        A topic is addressed by its slug in the other operations; the `id` is part of the
        response so a client can refer to the topic it has read.
      responses:
        '200':
          description: The published topics, in `position` order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}:
    get:
      tags:
        - content
      summary: Get one topic with its lessons
      operationId: getTopic
      description: |
        Returns the published topic addressed by its slug with its published lessons, in
        `position` order. Only published content is returned: a draft topic or a draft lesson
        is never part of the response.

        A topic is addressed by its slug; no endpoint looks a topic up by id.
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
      responses:
        '200':
          description: The published topic with its lessons, in `position` order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetail'
        '404':
          description: Not found. No published topic has this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lessons/{lessonId}:
    get:
      tags:
        - content
      summary: Get one lesson
      operationId: getLesson
      description: |
        Returns the published lesson addressed by its id, with its body in Markdown. Only
        published content is returned: a draft lesson is never part of the response. The
        lessons of a topic come in `position` order.
      parameters:
        - name: lessonId
          in: path
          required: true
          description: The id of the lesson.
          schema:
            type: string
      responses:
        '200':
          description: The published lesson.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '404':
          description: Not found. No published lesson has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}/lessons:
    post:
      tags:
        - content
      summary: Create a draft lesson
      operationId: createDraftLesson
      description: |
        Creates a new draft lesson for the topic. Requires a maintainer session.
        The lesson is not visible to users until published.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
      requestBody:
        required: true
        description: Lesson details for the draft.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftLessonRequest'
      responses:
        '201':
          description: Draft lesson created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftLesson'
        '400':
          description: Validation error for invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization error for non-maintainer user (`authorization_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No topic has this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}/lessons/{lessonId}:
    put:
      tags:
        - content
      summary: Update a draft lesson
      operationId: updateDraftLesson
      description: |
        Updates an existing draft lesson. Requires a maintainer session.
        Only draft lessons can be updated.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          description: The id of the lesson.
          schema:
            type: string
      requestBody:
        required: true
        description: Updated lesson details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftLessonRequest'
      responses:
        '200':
          description: Draft lesson updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftLesson'
        '400':
          description: Validation error for invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization error for non-maintainer user (`authorization_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No topic has this slug or no lesson has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}/lessons/{lessonId}/publish:
    put:
      tags:
        - content
      summary: Publish a lesson
      operationId: publishLesson
      description: |
        Publishes a draft lesson, making it visible to users. Requires a maintainer session.
        This operation only changes the status from draft to published.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          description: The id of the lesson.
          schema:
            type: string
      responses:
        '200':
          description: Lesson published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization error for non-maintainer user (`authorization_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No topic has this slug or no lesson has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}/lessons/{lessonId}/unpublish:
    put:
      tags:
        - content
      summary: Unpublish a lesson
      operationId: unpublishLesson
      description: |
        Unpublishes a lesson, returning it to draft status. Requires a maintainer session.
        This operation only changes the status from published to draft.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          description: The id of the lesson.
          schema:
            type: string
      responses:
        '200':
          description: Lesson unpublished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftLesson'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization error for non-maintainer user (`authorization_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No topic has this slug or no lesson has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}/questions:
    post:
      tags:
        - content
      summary: Create a draft question
      operationId: createDraftQuestion
      description: |
        Creates a new draft question for the topic. Requires a maintainer session.
        The question is not visible to users until published.
        Validation: 2-6 options, exactly one correct.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
      requestBody:
        required: true
        description: Question details for the draft.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftQuestionRequest'
      responses:
        '201':
          description: Draft question created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftQuestion'
        '400':
          description: Validation error for invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization error for non-maintainer user (`authorization_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No topic has this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}/questions/{questionId}:
    put:
      tags:
        - content
      summary: Update a draft question
      operationId: updateDraftQuestion
      description: |
        Updates an existing draft question. Requires a maintainer session.
        Only draft questions can be updated.
        Validation: 2-6 options, exactly one correct.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
        - name: questionId
          in: path
          required: true
          description: The id of the question.
          schema:
            type: string
      requestBody:
        required: true
        description: Updated question details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftQuestionRequest'
      responses:
        '200':
          description: Draft question updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftQuestion'
        '400':
          description: Validation error for invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization error for non-maintainer user (`authorization_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No topic has this slug or no question has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}/questions/{questionId}/publish:
    put:
      tags:
        - content
      summary: Publish a question
      operationId: publishQuestion
      description: |
        Publishes a draft question, making it visible to users. Requires a maintainer session.
        This operation only changes the status from draft to published.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
        - name: questionId
          in: path
          required: true
          description: The id of the question.
          schema:
            type: string
      responses:
        '200':
          description: Question published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizQuestion'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization error for non-maintainer user (`authorization_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No topic has this slug or no question has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}/questions/{questionId}/unpublish:
    put:
      tags:
        - content
      summary: Unpublish a question
      operationId: unpublishQuestion
      description: |
        Unpublishes a question, returning it to draft status. Requires a maintainer session.
        This operation only changes the status from published to draft.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
        - name: questionId
          in: path
          required: true
          description: The id of the question.
          schema:
            type: string
      responses:
        '200':
          description: Question unpublished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftQuestion'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization error for non-maintainer user (`authorization_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No topic has this slug or no question has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}/quiz:
    post:
      tags:
        - quiz
      summary: Start a quiz on a topic
      operationId: startQuiz
      description: |
        Starts a quiz on the topic. The response holds 5 questions, or all published
        questions of the topic when the topic has fewer than 5. The client cannot choose the
        number of questions.

        The questions are drawn at random from the published questions of the topic, so two
        calls can return different questions. Only published content is returned: a draft
        question is never part of a quiz.

        The response holds no property that reveals the correct option or the explanation:
        the server grades the submission. No authentication is required.
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
      responses:
        '200':
          description: The questions of the quiz, with their options and no answer revealed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizQuestionList'
        '404':
          description: Not found. No published topic has this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /topics/{topicSlug}/quiz/submissions:
    post:
      tags:
        - quiz
      summary: Submit a quiz on a topic
      operationId: submitQuiz
      description: |
        Submits the answers of a quiz and returns the graded result. A submission lists the
        quiz questions and the chosen option for each; the chosen option may be empty
        (`null`). The body carries no user id.

        A submission with a missing, invalid or expired session cookie is treated as
        anonymous: it is graded and answered normally, nothing is stored, and no 401 is
        returned. An anonymous submission without a session cookie is accepted without CSRF
        protection.

        A submission that carries a valid session cookie is state-changing and requires
        CSRF protection: the token must be sent in the `X-CSRF-Token` header. When a valid
        session is present, the attempt is stored for that user. The only 403 of this
        operation is a CSRF failure with a valid session.

        A question with no chosen option, or with an option that does not belong to it,
        counts as incorrect. A submission that contains a question which does not belong to
        the topic is rejected with a validation error.
      parameters:
        - name: topicSlug
          in: path
          required: true
          description: The slug of the topic.
          schema:
            type: string
      requestBody:
        required: true
        description: The answers of the quiz, one entry per question.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSubmissionRequest'
      responses:
        '200':
          description: The graded result of the submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSubmissionResult'
        '400':
          description: |
            Validation error. The submission contains a question that does not belong to the
            topic, so nothing is graded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF protection failed with a valid session (`forbidden`). Refresh the CSRF token and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No published topic has this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      tags:
        - auth
      summary: Register a new user
      operationId: register
      description: |
        Creates a new account. On success a session cookie is set and a CSRF token is
        issued. The token must be sent back in a header on every state-changing request
        that carries the session cookie.
      requestBody:
        required: true
        description: Registration details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and session started.
          headers:
            Set-Cookie:
              description: Session cookie (`HttpOnly`, `SameSite`, `Secure` in production, path `/`, expires in 7 days).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error for invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict for a duplicate email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - auth
      summary: Log in
      operationId: login
      description: |
        Authenticates with email and password. On success a session cookie is set and a
        CSRF token is issued. The token must be sent back in a header on every
        state-changing request that carries the session cookie.
      requestBody:
        required: true
        description: Login credentials.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated and session started.
          headers:
            Set-Cookie:
              description: Session cookie (`HttpOnly`, `SameSite`, `Secure` in production, path `/`, expires in 7 days).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication error for wrong credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Validation error for invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - auth
      summary: Log out
      operationId: logout
      description: |
        Ends the current session. State-changing request that carries a session cookie
        requires CSRF protection (token sent in header).
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF protection failed with a valid session (`forbidden`). Refresh the CSRF token and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/session:
    get:
      tags:
        - auth
      summary: Get current session
      operationId: getSession
      description: |
        Returns the current session if valid and issues the CSRF token on every read, so a
        client with a session cookie (for example after a page reload) can send
        state-changing requests. Answers 401 when there is no valid session. `GET` does not
        require CSRF protection.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/progress:
    get:
      tags:
        - progress
      summary: Get lesson progress
      operationId: getMyProgress
      description: |
        Returns the lesson progress for the logged-in user. No user id is taken in the
        request; ownership is enforced by the server from the session.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The lesson ids the user has marked complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/progress/lessons/{lessonId}:
    put:
      tags:
        - progress
      summary: Mark a lesson complete
      operationId: markLessonComplete
      description: |
        Marks a lesson as completed for the logged-in user. No user id is taken in the
        request; ownership is enforced by the server from the session. Marking a lesson
        complete is idempotent.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: lessonId
          in: path
          required: true
          description: The id of the lesson.
          schema:
            type: string
      responses:
        '200':
          description: Lesson marked complete (idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF protection failed with a valid session (`forbidden`). Refresh the CSRF token and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No published lesson has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - progress
      summary: Undo lesson completion
      operationId: unmarkLessonComplete
      description: |
        Removes completion for a lesson for the logged-in user. No user id is taken in
        the request; ownership is enforced by the server from the session. Undoing an
        unmarked lesson is not an error.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: lessonId
          in: path
          required: true
          description: The id of the lesson.
          schema:
            type: string
      responses:
        '200':
          description: Lesson completion removed (no error if not marked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF protection failed with a valid session (`forbidden`). Refresh the CSRF token and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. No published lesson has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/attempts:
    get:
      tags:
        - history
      summary: List quiz attempts
      operationId: listMyAttempts
      description: |
        Returns the quiz attempts for the logged-in user, newest first. No user id is
        taken in the request; ownership is enforced by the server from the session.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The quiz attempts, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptList'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/attempts/{attemptId}:
    get:
      tags:
        - history
      summary: Get quiz attempt details
      operationId: getMyAttempt
      description: |
        Returns the details of a quiz attempt for the logged-in user. No user id is
        taken in the request; ownership is enforced by the server from the session.
      security:
        - sessionCookie: []
      parameters:
        - name: attemptId
          in: path
          required: true
          description: The id of the attempt.
          schema:
            type: string
      responses:
        '200':
          description: The quiz attempt details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptDetail'
        '401':
          description: No valid session (`authentication_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found. The attempt does not exist or does not belong to the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error. The request could not be answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      tags:
        - health
      summary: Check that the service is up
      operationId: getHealth
      description: |
        Answers with the health of the service. It is used by the container health check and
        by the deployment check.
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie `HttpOnly`, `SameSite`, `Secure` in production, path `/`, expires in 7 days.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token issued at registration, log in and on every read of the current session; must be sent on state-changing requests that carry the session cookie.
  schemas:
    ContentStatus:
      type: string
      enum:
        - draft
        - published
      description: The status of content; only published content is visible to users.
    Error:
      type: object
      description: |
        The error object every error response carries.

        `code` is the value the client branches on: `validation_error` for the status 400
        (the request is invalid), `authentication_error` for the status 401 (no valid
        session or authentication failed), `forbidden` for the status 403 (CSRF protection
        failed with a valid session), `authorization_error` for the status 403 (a valid
        session lacks the required permission, for example a user without `is_maintainer`),
        `not_found` for the status 404 (the topic, the lesson or the question does not
        exist or is not published), `conflict` for the status 409 (the request conflicts
        with the current state) and `internal_error` for the status 500 (the server failed).

        A client retries a `forbidden` response after refreshing the CSRF token, for example
        with `GET /auth/session`, and does not retry an `authorization_error` response.
        Maintainer-only operations use the same `authorization_error` code for a valid
        session without `is_maintainer`.

        `message` is safe to show to the user. `details` is optional and carries extra
        information about the failure.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: The machine-readable error code the client branches on.
        message:
          type: string
          description: A message that is safe to show to the user.
        details:
          type: object
          additionalProperties: true
          description: |
            Optional details about the failure, for example the fields that failed the
            validation.

    TopicSummary:
      type: object
      description: A published topic of the platform.
      required:
        - id
        - slug
        - title
        - description
        - position
        - status
      properties:
        id:
          type: string
          description: The id of the topic.
        slug:
          type: string
          description: The slug of the topic; the operations address the topic by it.
        title:
          type: string
          description: The title of the topic.
        description:
          type: string
          description: The description of the topic.
        position:
          type: integer
          description: The position of the topic; the topics come in `position` order.
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: The status of the topic; only published topics are visible to users.

    TopicList:
      type: array
      description: The published topics, in `position` order.
      items:
        $ref: '#/components/schemas/TopicSummary'

    TopicDetail:
      type: object
      description: A published topic with its published lessons.
      required:
        - id
        - slug
        - title
        - description
        - position
        - status
        - lessons
      properties:
        id:
          type: string
          description: The id of the topic.
        slug:
          type: string
          description: The slug of the topic; the operations address the topic by it.
        title:
          type: string
          description: The title of the topic.
        description:
          type: string
          description: The description of the topic.
        position:
          type: integer
          description: The position of the topic; the topics come in `position` order.
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: The status of the topic; only published topics are visible to users.
        lessons:
          type: array
          description: The published lessons of the topic, in `position` order.
          items:
            $ref: '#/components/schemas/Lesson'

    Lesson:
      type: object
      description: A published lesson of a topic.
      required:
        - id
        - topic_id
        - title
        - body
        - position
        - status
      properties:
        id:
          type: string
          description: The id of the lesson.
        topic_id:
          type: string
          description: The id of the topic the lesson belongs to.
        title:
          type: string
          description: The title of the lesson.
        body:
          type: string
          description: The body of the lesson, in Markdown.
        position:
          type: integer
          description: The position of the lesson in its topic; the lessons come in `position` order.
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: The status of the lesson; only published lessons are visible to users.

    DraftLesson:
      type: object
      description: A lesson draft that can be edited and published.
      required:
        - id
        - topic_id
        - title
        - body
        - position
        - status
      properties:
        id:
          type: string
          description: The id of the lesson.
        topic_id:
          type: string
          description: The id of the topic the lesson belongs to.
        title:
          type: string
          description: The title of the lesson.
        body:
          type: string
          description: The body of the lesson, in Markdown.
        position:
          type: integer
          description: The position of the lesson in its topic; the lessons come in `position` order.
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: The status of the lesson; only published lessons are visible to users.

    QuizOption:
      type: object
      description: One answer option of a question, in the order the server returns it.
      required:
        - id
        - text
      properties:
        id:
          type: string
          description: The id of the option.
        text:
          type: string
          description: The text of the option.

    DraftQuestionOption:
      type: object
      description: One answer option of a draft question, with correct flag.
      required:
        - id
        - text
        - is_correct
      properties:
        id:
          type: string
          description: The id of the option.
        text:
          type: string
          description: The text of the option.
        is_correct:
          type: boolean
          description: Whether this option is the correct answer.

    QuizQuestion:
      type: object
      description: |
        One question of a quiz with its options. It holds no correct answer and no
        explanation: the server grades the submission.
      required:
        - id
        - text
        - options
      properties:
        id:
          type: string
          description: The id of the question.
        text:
          type: string
          description: The text of the question.
        options:
          type: array
          description: The options of the question, in a stable order.
          items:
            $ref: '#/components/schemas/QuizOption'

    DraftQuestion:
      type: object
      description: |
        A draft question with its options and correct answer. Only published questions
        appear in quizzes and user interfaces.
      required:
        - id
        - topic_id
        - text
        - options
        - status
      properties:
        id:
          type: string
          description: The id of the question.
        topic_id:
          type: string
          description: The id of the topic the question belongs to.
        text:
          type: string
          description: The text of the question.
        options:
          type: array
          description: The options of the question, with exactly one marked as correct.
          minItems: 2
          maxItems: 6
          items:
            $ref: '#/components/schemas/DraftQuestionOption'
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: The status of the question; only published questions are visible to users.

    DraftLessonRequest:
      type: object
      description: |
        The body to create or update a draft lesson. It carries no id, no topic id and no
        status: the server assigns the id, the topic comes from the path and the lesson is
        always a draft. Only the publish operation changes the status.
      required:
        - title
        - body
        - position
      properties:
        title:
          type: string
          description: The title of the lesson.
        body:
          type: string
          description: The body of the lesson, in Markdown.
        position:
          type: integer
          description: The position of the lesson in its topic.

    DraftQuestionOptionInput:
      type: object
      description: One answer option in a draft question request; the server assigns the id.
      required:
        - text
        - is_correct
      properties:
        text:
          type: string
          description: The text of the option.
        is_correct:
          type: boolean
          description: Whether this option is the correct answer.

    DraftQuestionRequest:
      type: object
      description: |
        The body to create or update a draft question. It carries no id, no topic id and no
        status: the server assigns the id, the topic comes from the path and the question is
        always a draft. Only the publish operation changes the status.
      required:
        - text
        - options
      properties:
        text:
          type: string
          description: The text of the question.
        options:
          type: array
          description: The options of the question, 2 to 6, with exactly one marked as correct.
          minItems: 2
          maxItems: 6
          items:
            $ref: '#/components/schemas/DraftQuestionOptionInput'
          contains:
            type: object
            required:
              - is_correct
            properties:
              is_correct:
                const: true
          minContains: 1
          maxContains: 1

    QuizQuestionList:
      type: array
      description: |
        The questions of the quiz: 5 of them, or all published questions of the topic when
        the topic has fewer than 5.
      items:
        $ref: '#/components/schemas/QuizQuestion'

    QuizSubmissionAnswer:
      type: object
      description: The answer of one question of the quiz.
      required:
        - question_id
        - option_id
      properties:
        question_id:
          type: string
          description: The id of the question the answer belongs to.
        option_id:
          type:
            - string
            - "null"
          description: The id of the chosen option, or `null` when the question is unanswered.

    QuizSubmissionRequest:
      type: object
      description: |
        The answers of a submission, one entry per question of the quiz. It carries no user
        id and no session token.
      required:
        - answers
      properties:
        answers:
          type: array
          description: The answers of the quiz, one entry per question.
          items:
            $ref: '#/components/schemas/QuizSubmissionAnswer'

    QuizSubmissionResultAnswer:
      type: object
      description: The graded answer of one question of the quiz.
      required:
        - question_id
        - is_correct
        - correct_option_text
        - explanation
      properties:
        question_id:
          type: string
          description: The id of the question.
        is_correct:
          type: boolean
          description: Whether the answer was correct.
        correct_option_text:
          type: string
          description: The text of the correct option.
        explanation:
          type: string
          description: A short explanation of the correct answer.

    QuizSubmissionResult:
      type: object
      description: The graded result of a submission.
      required:
        - score
        - total
        - answers
      properties:
        score:
          type: integer
          description: The number of correct answers.
        total:
          type: integer
          description: The number of questions of the quiz.
        answers:
          type: array
          description: The graded answer of every question of the quiz.
          items:
            $ref: '#/components/schemas/QuizSubmissionResultAnswer'

    HealthStatus:
      type: object
      description: The health of the service.
      required:
        - status
      properties:
        status:
          type: string
          description: The status of the service, for example `ok`.

    RegisterRequest:
      type: object
      description: Registration request.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: The user's email address.
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: The user's password (8-128 characters).

    LoginRequest:
      type: object
      description: Login request.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: The user's email address.
        password:
          type: string
          description: The user's password.

    UserSummary:
      type: object
      description: Public user summary.
      required:
        - id
        - email
      properties:
        id:
          type: string
          description: The user's id.
        email:
          type: string
          format: email
          description: The user's email address.

    AuthResponse:
      type: object
      description: Authentication response with CSRF token.
      required:
        - user
        - csrf_token
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        csrf_token:
          type: string
          description: CSRF token to send in `X-CSRF-Token` header on state-changing requests that carry the session cookie.

    SessionResponse:
      type: object
      description: Current session.
      required:
        - user
        - csrf_token
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        csrf_token:
          type: string
          description: CSRF token to send in `X-CSRF-Token` header on state-changing requests that carry the session cookie.

    LogoutResponse:
      type: object
      description: Logout result.
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether logout succeeded.

    ProgressResponse:
      type: array
      description: The lesson ids the logged-in user has marked complete.
      items:
        type: string

    QuizAttemptAnswer:
      type: object
      description: |
        A snapshot of one answer in a stored quiz attempt. The snapshot keeps the question
        text, the selected answer text and the correct answer text at the time of the
        attempt so later edits or removal of a question do not change past attempts.
      required:
        - question_id
        - question_text
        - selected_option_text
        - correct_option_text
        - is_correct
      properties:
        question_id:
          type:
            - string
            - "null"
          description: The id of the question at the time of the attempt, or null if the question was removed.
        question_text:
          type: string
          description: The text of the question at the time of the attempt.
        selected_option_text:
          type: string
          description: The text of the selected option, or an empty string if the question was unanswered.
        correct_option_text:
          type: string
          description: The text of the correct option at the time of the attempt.
        is_correct:
          type: boolean
          description: Whether the answer was correct.

    QuizAttemptListItem:
      type: object
      description: A quiz attempt summary for the list, newest first.
      required:
        - id
        - topic_id
        - topic_slug
        - score
        - total
        - created_at
      properties:
        id:
          type: string
          description: The id of the attempt.
        topic_id:
          type: string
          description: The id of the topic.
        topic_slug:
          type: string
          description: The slug of the topic.
        score:
          type: integer
          description: The number of correct answers.
        total:
          type: integer
          description: The number of questions in the attempt.
        created_at:
          type: string
          format: date-time
          description: When the attempt was created.

    QuizAttemptList:
      type: array
      description: Quiz attempts for the logged-in user, newest first.
      items:
        $ref: '#/components/schemas/QuizAttemptListItem'

    QuizAttemptDetail:
      type: object
      description: The full details of a quiz attempt with per-question answers.
      required:
        - id
        - topic_id
        - topic_slug
        - score
        - total
        - created_at
        - answers
      properties:
        id:
          type: string
          description: The id of the attempt.
        topic_id:
          type: string
          description: The id of the topic.
        topic_slug:
          type: string
          description: The slug of the topic.
        score:
          type: integer
          description: The number of correct answers.
        total:
          type: integer
          description: The number of questions in the attempt.
        created_at:
          type: string
          format: date-time
          description: When the attempt was created.
        answers:
          type: array
          description: The snapshot answers for each question in the attempt.
          items:
            $ref: '#/components/schemas/QuizAttemptAnswer'
